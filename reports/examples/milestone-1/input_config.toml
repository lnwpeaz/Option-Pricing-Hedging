# Proposed experiment inputs, not executed results.
# Rates, volatility and time are annualized; cost is basis points of traded notional.
[option]
spot = 100.0
strike = 100.0
maturity_years = 1.0
risk_free_rate = 0.05
dividend_yield = 0.0
volatility = 0.20
kind = "call"

[simulation]
model = "gbm"
measure = "physical"
physical_drift = 0.08
true_volatility = 0.20
paths = 10000
steps_per_year = 252
seed = 42

[pricing]
tree_steps = 1000
monte_carlo_paths = 100000
monte_carlo_seed = 43

[hedging]
position = "short_call"
quantity = 1.0
hedge_volatility = 0.20
rebalance_every_steps = 1
one_way_cost_bps = 0.0
liquidate_stock_at_expiry = true

[sensitivity]
rebalance_every_steps = [1, 5]
one_way_cost_bps = [0.0, 5.0, 10.0]
hedge_volatility = [0.15, 0.20, 0.25]
